openapi: 3.0.0
info:
  title: store
  version: '1.0'
  description: A simple store
  contact:
    name: SecuritEase Dev
    url: 'https://www.securitease.com'
    email: internal@securitease.com
  termsOfService: 'https://www.securitease.com'
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.htm'
servers:
  - url: 'http://localhost:8080'
    description: dev
paths:
  /order:
    get:
      summary: Get Orders
      tags:
        - store
      operationId: getOrders
      description: Get all orders, including the customer and products each order contains
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      summary: Create Order
      tags:
        - store
      operationId: createOrder
      description: Create a new order for an existing customer, referencing 1 or more existing products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Bad Request - validation failed (missing description, customer, or products)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found - the referenced customer or product does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - request conflicts with existing data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /order/{id}:
    get:
      summary: Get Order by ID
      tags:
        - store
      operationId: getOrderById
      description: Get a specific order by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Bad Request - id is not a valid number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /customer:
    get:
      summary: Get Customers
      tags:
        - store
      operationId: getCustomers
      description: >-
        Get all customers. If the query parameter is supplied, returns only customers where at
        least one word in their name contains that substring (case-insensitive) instead of
        the full list.
      parameters:
        - name: query
          in: query
          description: Substring to match against individual words in the customer's name
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      summary: Create Customer
      tags:
        - store
      operationId: createCustomer
      description: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Bad Request - validation failed (blank name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products:
    get:
      summary: Get Products
      tags:
        - store
      operationId: getProducts
      description: Get all products, each with the IDs of the orders that contain it
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create Product
      tags:
        - store
      operationId: createProduct
      description: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Bad Request - validation failed (blank description)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products/{id}:
    get:
      summary: Get Product by ID
      tags:
        - store
      operationId: getProductById
      description: Get a specific product by its ID, including the IDs of the orders that contain it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Order:
      title: Order
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        customer:
          $ref: '#/components/schemas/OrderCustomer'
        products:
          type: array
          items:
            $ref: '#/components/schemas/OrderProduct'
    OrderCustomer:
      title: OrderCustomer
      description: Truncated view of the customer an order belongs to
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    OrderProduct:
      title: OrderProduct
      description: Truncated view of a product contained in an order
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
    CreateOrderRequest:
      title: CreateOrderRequest
      type: object
      required:
        - description
        - customer
        - products
      properties:
        description:
          type: string
          minLength: 1
        customer:
          type: object
          description: Reference to an existing customer by id
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
        products:
          type: array
          description: References to 1 or more existing products by id
          minItems: 1
          items:
            type: object
            required:
              - id
            properties:
              id:
                type: integer
                format: int64
    Customer:
      title: Customer
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        orders:
          type: array
          items:
            $ref: '#/components/schemas/CustomerOrder'
    CustomerOrder:
      title: CustomerOrder
      description: Truncated view of an order belonging to a customer
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
    CreateCustomerRequest:
      title: CreateCustomerRequest
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    Product:
      title: Product
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        orders:
          description: IDs of the orders that contain this product
          type: array
          items:
            type: integer
            format: int64
    CreateProductRequest:
      title: CreateProductRequest
      type: object
      required:
        - description
      properties:
        description:
          type: string
          minLength: 1
    ErrorResponse:
      title: ErrorResponse
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
tags:
  - name: store
    description: store operations
